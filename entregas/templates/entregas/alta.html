<form method="post">
    {% csrf_token %}
    <input type="hidden" name="idempotency_key" value="{{ idempotency_key }}">
    <input name="origen" placeholder="Origen" required>
    <input name="destino" placeholder="Destino" required>
    <input name="peso" type="number" step="0.01" placeholder="Peso (kg)" required>
    <input name="largo" type="number" step="0.01" placeholder="Largo (cm)" required>
    <input name="ancho" type="number" step="0.01" placeholder="Ancho (cm)" required>
    <input name="alto" type="number" step="0.01" placeholder="Alto (cm)" required>
    <label><input name="urgente" type="checkbox"> Urgente</label>
    <input name="fecha_limite" type="datetime-local" required>
    <button type="submit">Registrar pedido</button>
</form>
